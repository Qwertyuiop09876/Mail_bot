[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mailbot"
version = "0.1.0"
description = "Модуль качественных почтовых рассылок: Яндекс Почта и доменная почта, планирование, отписки, баунсы."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.1.3",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "email-validator>=2.3.0",
    "dnspython>=2.8.0",
    "cryptography>=50.0.2",
    "click>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "aiosmtpd>=1.4.6",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
]

[project.scripts]
mailbot = "mailbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mailbot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/mailbot/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "PTH",      # pathlib
    "T20",      # no print() in library code
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — это нормально
    "S101",                        # assert используется для сужения типов (mypy), а не для валидации
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "T20"]
"examples/**" = ["T20", "S105", "S106"]
"src/mailbot/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
mypy_path = "src"
files = ["src", "tests", "examples"]
exclude = ["src/mailbot/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["aiosmtpd.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
